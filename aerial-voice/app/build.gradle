plugins {
    id 'com.android.application'
}

android {
    namespace 'app.orchard.tv.aerialvoice'
    compileSdk 34

    flavorDimensions 'purpose'
    productFlavors {
        micTest {
            dimension 'purpose'
            applicationIdSuffix '.mictest'
            versionNameSuffix '-mictest'
        }
    }
    defaultConfig {
        applicationId 'app.orchard.tv.aerialvoice'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
