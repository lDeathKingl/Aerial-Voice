plugins {
    id 'com.android.application'
}

android {
    namespace 'app.orchard.tv.aerialvoice'
    compileSdk 34

    flavorDimensions 'purpose'
    productFlavors {
        micTest {
            dimension 'purpose'
            applicationIdSuffix '.mictest'
            versionNameSuffix '-mictest'
        }
    }
    defaultConfig {
        applicationId 'app.orchard.tv.aerialvoice'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.4.0'
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
