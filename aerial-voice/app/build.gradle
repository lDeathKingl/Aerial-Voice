plugins {
    id 'com.android.application'
}

android {
    namespace 'app.orchard.tv.aerialvoice'
    compileSdk 34

    defaultConfig {
        applicationId 'app.orchard.tv.aerialvoice'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
