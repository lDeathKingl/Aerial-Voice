plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.orchard.tv.aerialvoice'
    compileSdk 34

    flavorDimensions 'purpose'
    productFlavors {
        full {
            dimension 'purpose'
        }
        micTest {
            dimension 'purpose'
            applicationIdSuffix '.mictest06'
            versionNameSuffix '-mictest06'
            resValue 'string', 'app_name', 'Aerial Voice 0.7.0'
        }
    }
    defaultConfig {
        applicationId 'app.orchard.tv.aerialvoice'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.7.0'
    }

    signingConfigs {
        stableDebug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation files('libs/sherpa-onnx.aar')
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
