name: Research ATV Search APK (static analysis)
on:
  push:
    branches:
      - research/atv-apk-inspection-2026-11
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtain official ATV Search APK without executing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p atv-report
          python3 - <<'PY'
          import urllib.request, urllib.parse, zipfile, hashlib, re
          from pathlib import Path
          base='https://www.slavenja.ru/'
          req=urllib.request.Request(base,headers={'User-Agent':'Mozilla/5.0'})
          page=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          print('HTML length',len(page))
          print('API references',sorted(set(re.findall(r'(?:"|\x27)(/api/[^"\x27 ]+)',page)))[:25])
          for m in re.finditer(r'app_info|downloadUrl|/api/',page,re.I):
              snip=page[max(m.start()-110,0):m.end()+180].replace('\n',' ')
              print('DYNAMIC_SITE_REFERENCE',snip[:300])
              if m.start()>16000:break
          urls=[
              'https://www.slavenja.ru/api/download.php',
              'https://www.slavenja.ru/api/download.php?downloader=1',
              'https://slavenja.ru/api/download.php'
          ]
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/vnd.android.package-archive,*/*'})
                  with urllib.request.urlopen(req,timeout=90) as r:
                      blob=r.read(12*1024*1024)
                      print('DOWNLOAD_CANDIDATE',url,'status',r.status,'type',r.headers.get('Content-Type'),'bytes',len(blob),'redirect',r.url,'magic',blob[:8].hex())
                  path=Path('atv-report/atv-search.apk')
                  path.write_bytes(blob)
                  with zipfile.ZipFile(path) as apk:
                      names=apk.namelist()
                      if 'AndroidManifest.xml' not in names or not any(x.endswith('.dex') for x in names):
                          print('NOT_VALID_ANDROID_APK',url);path.unlink();continue
                      print('VALID_APK',url,'SHA256',hashlib.sha256(blob).hexdigest(),'numFiles',len(names),'dex',[x for x in names if x.endswith('.dex')])
                  break
              except Exception as e:
                  print('DOWNLOAD_ERROR',url,type(e).__name__,str(e)[:250])
          else:
              raise RuntimeError('No publicly retrievable verified APK from official download endpoint')
          PY
      - name: Extract APK manifest, APK metadata, and relevant class references
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install 'androguard==4.1.3' --break-system-packages
          python3 - <<'PY'
          from androguard.core.apk import APK
          from xml.etree import ElementTree as ET
          import hashlib
          path='atv-report/atv-search.apk'
          a=APK(path)
          print('=== VERIFIED APK METADATA ===')
          print('package',a.get_package(),'versionName',a.get_androidversion_name(),'versionCode',a.get_androidversion_code())
          print('sdk min',a.get_min_sdk_version(),'target',a.get_target_sdk_version(),'APK sha256',hashlib.sha256(open(path,'rb').read()).hexdigest())
          print('permissions',sorted(a.get_permissions()))
          for label,items in [('activities',a.get_activities()),('services',a.get_services()),('receivers',a.get_receivers()),('providers',a.get_providers())]:
              print('===',label.upper(),'count',len(items),'===')
              for item in items:print(item)
          xml=a.get_android_manifest_xml()
          ns='{http://schemas.android.com/apk/res/android}'
          for elem in xml.iter():
              if elem.tag in {'service','activity','provider','receiver'}:
                  desc={'tag':elem.tag,'name':elem.get(ns+'name'),'exported':elem.get(ns+'exported'),'permission':elem.get(ns+'permission'),'authorities':elem.get(ns+'authorities')}
                  actions=[c.get(ns+'name') for c in elem.iter('action')]
                  if actions:desc['actions']=actions
                  print('MANIFEST_COMPONENT',desc)
          print('=== RESOURCE PACKAGE NAMES AND PACKAGED ASSETS ===')
          import zipfile
          with zipfile.ZipFile(path) as z:
              for x in z.namelist():
                  if any(k in x.lower() for k in ('model','vosk','sherpa','zona','searchable','intent','accessibility','assets/')):
                      print('PACKAGED_FILE',x)
          PY
      - name: Decompile APK for interoperability investigation (no code execution)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          /tmp/jadx/bin/jadx --no-res --threads-count 4 -d atv-report/decompiled atv-report/atv-search.apk > atv-report/jadx-run.log 2>&1 || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('atv-report/decompiled/sources')
          print('DECOMPILED_FILES',len(list(root.rglob('*.java'))))
          patterns={
            'ZONA':re.compile(r'mobi\.zona|ru\.zona|freezona|ZonaProvider|zona://|zona[/.]',re.I),
            'SEARCH_PROVIDER':re.compile(r'search_suggest_query|SUGGEST_COLUMN_|getSearchableInfo|searchSuggestAuthority|query\(.*Cursor|content://',re.I),
            'VOICE_BRIDGE':re.compile(r'KEYCODE_F5|KEYCODE_SEARCH|VoiceInteractionService|VoiceInteractionSession|ROLE_ASSISTANT|accessibilityService|KEYCODE_VOICE_ASSIST|ASSIST',re.I),
            'AUDIO':re.compile(r'AudioRecord|SpeechRecognizer|RecognitionListener|SpeechEngine|sherpa|vosk|AudioDeviceInfo',re.I),
            'MEDIA_CONTROL':re.compile(r'AudioManager\.setStreamVolume|adjustStreamVolume|MediaSessionManager',re.I)
          }
          for key,pattern in patterns.items():
              print('=== IDENTIFIERS CATEGORY',key,'===')
              hits=0
              for f in root.rglob('*.java'):
                  try:lines=f.read_text(encoding='utf-8',errors='ignore').splitlines()
                  except Exception:continue
                  indices=[i for i,l in enumerate(lines) if pattern.search(l)]
                  if not indices:continue
                  print('MATCH_FILE',str(f.relative_to(root)),'matches',len(indices))
                  for i in indices[:4]:
                      print('MATCH_LINE',i+1,lines[i].strip()[:300])
                  hits+=len(indices)
                  if hits>75:
                      print('TRUNCATED_CATEGORY',key);break
              print('TOTAL_MATCHES_AT_LEAST',hits)
          PY
      - name: Save summary, no third-party APK or decompiled source in artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atv-apk-static-analysis-logs
          path: |
            atv-report/jadx-run.log
          retention-days: 7
