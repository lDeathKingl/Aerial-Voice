name: Build Aerial Voice full assistant

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aerial Voice
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 34 and 36
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platforms and build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Download official Russian Trusted Root CA for GigaChat
        run: |
          mkdir -p aerial-voice/app/src/main/res/raw
          curl --fail --location --retry 3 --retry-delay 2 "https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt" -o aerial-voice/app/src/main/res/raw/russian_trusted_root_ca_pem.crt
          test -s aerial-voice/app/src/main/res/raw/russian_trusted_root_ca_pem.crt

      - name: Set up Gradle for Aerial Voice
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aerial-voice-debug-keystore-v2
          save-always: true

      - name: Create stable debug signing key if cache is empty
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Download and verify pinned sherpa-onnx Android AAR
        run: |
          mkdir -p aerial-voice/app/libs
          curl --fail --location --retry 3 --retry-delay 2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" -o aerial-voice/app/libs/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  aerial-voice/app/libs/sherpa-onnx-2.0.1.aar" | sha256sum -c -

      - name: Build full and micTest06 Aerial Voice APKs
        working-directory: aerial-voice
        run: gradle --no-daemon clean :app:testMicTestDebugUnitTest :app:assembleFullDebug :app:assembleMicTestDebug

      - name: Get Aerial 1.95 and Korobovo weather patch
        run: |
          git clone --depth 1 --branch v1.95 https://github.com/pengchujin/aerial-tv.git korobovo-upstream
          git clone --depth 1 https://github.com/lDeathKingl/Aerial-Korobovo.git korobovo-patches
          cp korobovo-patches/patch/Weather.kt korobovo-upstream/app/src/main/java/app/orchard/tv/weather/Weather.kt

      - name: Apply safe Xiaomi F5 bridge and isolate Korobovo package
        run: |
          python3 patch/patch_aerial_voice.py korobovo-upstream
          python3 - <<'PY'
          from pathlib import Path
          p = Path('korobovo-upstream/app/build.gradle.kts')
          src = p.read_text(encoding='utf-8')
          old = 'create("guard") {\n'
          assert src.count(old) == 1, 'Unexpected Aerial 1.95 Gradle config'
          # Preserve the existing Korobovo test package ID; never overwrite official Aerial.
          src = src.replace(old, old + '            applicationIdSuffix = ".korobovo"\n', 1)
          p.write_text(src, encoding='utf-8')
          PY

      - name: Build patched Aerial Korobovo guard APK
        working-directory: korobovo-upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleGuardRelease

      - name: Bundle Russian offline models on CI runner (not on TV)
        run: |
          set -euo pipefail
          mkdir -p dist/offline-models/vosk dist/offline-models/gigaam-v3
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://huggingface.co/nocmt/GigaAM-v3-E2E-CTC-int8-ONNX/resolve/main/model.int8.onnx" \
            -o dist/offline-models/gigaam-v3/model.int8.onnx
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://huggingface.co/nocmt/GigaAM-v3-E2E-CTC-int8-ONNX/resolve/main/tokens.txt" \
            -o dist/offline-models/gigaam-v3/tokens.txt
          echo "784d77aaa7a0899a247e72c71d667792087ee4dec985db1f57961767a5f6014f  dist/offline-models/gigaam-v3/model.int8.onnx" | sha256sum -c -
          echo "142de7570b3de5b3035ce111a89c228e80e6085273731d944093ddf24fa539cd  dist/offline-models/gigaam-v3/tokens.txt" | sha256sum -c -
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip" \
            -o dist/offline-models/vosk/vosk-model-small-ru-0.22.zip
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          root = Path('dist/offline-models')
          with zipfile.ZipFile(root / 'vosk/vosk-model-small-ru-0.22.zip') as z:
              names = set(z.namelist())
              for f in ('am/final.mdl', 'conf/mfcc.conf', 'graph/Gr.fst'):
                  assert f'vosk-model-small-ru-0.22/{f}' in names, f
          data = {'format': 'AerialVoice-offline-model-cache-v1', 'files': []}
          for f in sorted(root.rglob('*')):
              if f.is_file() and f.name != 'manifest.json':
                  data['files'].append({'path': f.relative_to(root).as_posix(), 'bytes': f.stat().st_size, 'sha256': hashlib.sha256(f.read_bytes()).hexdigest()})
          (root / 'manifest.json').write_text(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Prepare combined release bundle
        run: |
          mkdir -p dist
          cp aerial-voice/app/build/outputs/apk/full/debug/app-full-debug.apk dist/aerial-voice-full-debug.apk
          cp aerial-voice/app/build/outputs/apk/micTest/debug/app-micTest-debug.apk dist/aerial-voice-mictest06-debug.apk
          cp korobovo-upstream/app/build/outputs/apk/guard/release/*.apk dist/aerial-korobovo-voice-bridge.apk
          cp tools/install-full-assistant.ps1 tools/offline-install.ps1 tools/prepare-offline-models.ps1 dist/
          cp README.md HANDOFF_NEXT_CHAT.md CHANGELOG.md dist/
          cd dist
          zip -r aerial-voice-0.6.2-offline.zip aerial-voice-full-debug.apk aerial-voice-mictest06-debug.apk aerial-korobovo-voice-bridge.apk offline-models offline-install.ps1 prepare-offline-models.ps1 install-full-assistant.ps1 README.md HANDOFF_NEXT_CHAT.md CHANGELOG.md

      - name: Upload combined APKs and installer
        uses: actions/upload-artifact@v4
        with:
          name: aerial-voice-0.6.2-offline
          path: |
            dist/aerial-voice-full-debug.apk
            dist/aerial-voice-mictest06-debug.apk
            dist/aerial-korobovo-voice-bridge.apk
            dist/aerial-voice-0.6.2-offline.zip
            dist/README.md
            dist/HANDOFF_NEXT_CHAT.md
            dist/CHANGELOG.md
          if-no-files-found: error
