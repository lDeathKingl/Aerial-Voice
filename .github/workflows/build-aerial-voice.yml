name: Build Aerial Voice APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key for app updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aerial-voice-debug-keystore-v1

      - name: Build debug APK
        working-directory: aerial-voice
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Prepare release bundle
        run: |
          mkdir -p dist
          cp aerial-voice/app/build/outputs/apk/debug/app-debug.apk dist/aerial-voice-debug.apk
          cp tools/install-aerial-voice.ps1 dist/
          cp tools/remove-aerial-voice.ps1 dist/
          cp tools/diagnose-aerial-voice.ps1 dist/
          cp README.md dist/
          cp HANDOFF_NEXT_CHAT.md dist/
          cp CHANGELOG.md dist/
          cd dist
          zip -r aerial-voice-install-bundle.zip aerial-voice-debug.apk install-aerial-voice.ps1 remove-aerial-voice.ps1 diagnose-aerial-voice.ps1 README.md HANDOFF_NEXT_CHAT.md

      - name: Upload APK and scripts
        uses: actions/upload-artifact@v4
        with:
          name: aerial-voice-0.1.0
          path: |
            dist/aerial-voice-debug.apk
            dist/aerial-voice-install-bundle.zip
            dist/README.md
            dist/HANDOFF_NEXT_CHAT.md
            dist/CHANGELOG.md
          if-no-files-found: error
