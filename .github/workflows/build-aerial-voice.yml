name: Build Aerial Voice APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Download official Russian Trusted Root CA for GigaChat
        run: |
          mkdir -p aerial-voice/app/src/main/res/raw
          curl --fail --location --retry 3 --retry-delay 2 "https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt" -o aerial-voice/app/src/main/res/raw/russian_trusted_root_ca_pem.crt
          test -s aerial-voice/app/src/main/res/raw/russian_trusted_root_ca_pem.crt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key for app updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aerial-voice-debug-keystore-v1

      - name: Build debug APK
        working-directory: aerial-voice
        run: gradle --no-daemon clean :app:assembleMicTestDebug

      - name: Prepare release bundle
        run: |
          mkdir -p dist
          cp aerial-voice/app/build/outputs/apk/micTest/debug/app-micTest-debug.apk dist/aerial-voice-vosk-test-debug.apk
          cp tools/install-mic-test.ps1 dist/
          cp tools/remove-mic-test.ps1 dist/
          cp tools/diagnose-mic-test.ps1 dist/
          cp README.md dist/
          cp HANDOFF_NEXT_CHAT.md dist/
          cp CHANGELOG.md dist/
          cd dist
          zip -r aerial-voice-vosk-test-0.5.2.zip aerial-voice-vosk-test-debug.apk install-mic-test.ps1 remove-mic-test.ps1 diagnose-mic-test.ps1 README.md HANDOFF_NEXT_CHAT.md

      - name: Upload APK and scripts
        uses: actions/upload-artifact@v4
        with:
          name: aerial-voice-vosk-test-0.5.2
          path: |
            dist/aerial-voice-vosk-test-debug.apk
            dist/aerial-voice-vosk-test-0.5.2.zip
            dist/README.md
            dist/HANDOFF_NEXT_CHAT.md
            dist/CHANGELOG.md
          if-no-files-found: error
