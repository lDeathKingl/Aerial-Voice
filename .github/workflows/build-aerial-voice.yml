name: Build Aerial Voice full assistant

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aerial Voice
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 34 and 36
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platforms and build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Download official Russian Trusted Root CA for GigaChat
        run: |
          mkdir -p aerial-voice/app/src/main/res/raw
          curl --fail --location --retry 3 --retry-delay 2 "https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt" -o aerial-voice/app/src/main/res/raw/russian_trusted_root_ca_pem.crt
          test -s aerial-voice/app/src/main/res/raw/russian_trusted_root_ca_pem.crt

      - name: Set up Gradle for Aerial Voice
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aerial-voice-debug-keystore-v2
          save-always: true

      - name: Require the existing Aerial Voice signing key
        run: |
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "::error::Signing key cache is missing. Refusing to generate a different key or an incompatible APK."
            exit 1
          fi

      - name: Download verified sherpa-onnx Android runtime
        run: |
          set -euo pipefail
          mkdir -p aerial-voice/app/libs
          curl --fail --location --retry 5 --retry-all-errors --max-time 900 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" \
            -o aerial-voice/app/libs/sherpa-onnx.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  aerial-voice/app/libs/sherpa-onnx.aar" | sha256sum -c -
          unzip -l aerial-voice/app/libs/sherpa-onnx.aar | grep -F 'classes.jar'

      - name: Build full and micTest06 Aerial Voice APKs
        working-directory: aerial-voice
        run: gradle --no-daemon clean :app:testMicTestDebugUnitTest :app:assembleFullDebug :app:assembleMicTestDebug

      - name: Verify signing certificate against the stable release
        run: |
          set -euo pipefail
          # Public fingerprint pinned to the first verified stableDebug release.
          EXPECTED="734817b1e327db7ac64cdece612746913b37faf29aa2c57e7a9c017d43b78558"
          CACHED="$(keytool -exportcert -rfc -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$CACHED" != "$EXPECTED" ]; then
            echo "::error::Unexpected signing keystore. Expected $EXPECTED, got $CACHED. Refusing release."
            exit 1
          fi
          echo "Stable signing keystore certificate verified: $EXPECTED"
          SIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          for apk in aerial-voice/app/build/outputs/apk/full/debug/app-full-debug.apk aerial-voice/app/build/outputs/apk/micTest/debug/app-micTest-debug.apk; do
            ACTUAL="$("$SIGNER" verify --print-certs "$apk" | grep 'certificate SHA-256 digest:' | head -n 1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Signing certificate mismatch for $apk. Expected $EXPECTED, got $ACTUAL. Refusing to publish."
              exit 1
            fi
          done
          echo "Both Aerial Voice variants use expected 0.7.0 signing certificate."

      - name: Verify Aerial Voice APK package names and version
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          MIC="$("$AAPT" dump badging aerial-voice/app/build/outputs/apk/micTest/debug/app-micTest-debug.apk | grep '^package:' | head -n1)"
          FULL="$("$AAPT" dump badging aerial-voice/app/build/outputs/apk/full/debug/app-full-debug.apk | grep '^package:' | head -n1)"
          echo "$MIC"
          echo "$FULL"
          [[ "$MIC" == *"name='app.orchard.tv.aerialvoice.mictest06'"* ]]
          [[ "$FULL" == *"name='app.orchard.tv.aerialvoice'"* ]]
          [[ "$MIC" == *"versionCode='11'"* ]]
          [[ "$FULL" == *"versionCode='11'"* ]]

      - name: Get Aerial 1.95 and Korobovo weather patch
        run: |
          git clone --depth 1 --branch v1.95 https://github.com/pengchujin/aerial-tv.git korobovo-upstream
          git clone --depth 1 https://github.com/lDeathKingl/Aerial-Korobovo.git korobovo-patches
          cp korobovo-patches/patch/Weather.kt korobovo-upstream/app/src/main/java/app/orchard/tv/weather/Weather.kt

      - name: Apply safe Xiaomi F5 bridge and isolate Korobovo package
        run: |
          python3 patch/patch_aerial_voice.py korobovo-upstream
          python3 - <<'PY'
          from pathlib import Path
          p = Path('korobovo-upstream/app/build.gradle.kts')
          src = p.read_text(encoding='utf-8')
          old = 'create("guard") {\n'
          assert src.count(old) == 1, 'Unexpected Aerial 1.95 Gradle config'
          # Preserve the existing Korobovo test package ID; never overwrite official Aerial.
          src = src.replace(old, old + '            applicationIdSuffix = ".korobovo"\n', 1)
          p.write_text(src, encoding='utf-8')
          PY

      - name: Build patched Aerial Korobovo guard APK
        working-directory: korobovo-upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleGuardRelease

      - name: Verify patched Korobovo package name
        run: |
          set -euo pipefail
          APK="$(find korobovo-upstream/app/build/outputs/apk/guard/release -maxdepth 1 -name '*.apk' | head -n1)"
          test -n "$APK"
          PACKAGE="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep '^package:' | head -n1)"
          echo "$PACKAGE"
          [[ "$PACKAGE" == *"name='app.orchard.tv.korobovo'"* ]]

      - name: Download both Russian offline models on the CI runner
        run: |
          bash tools/prepare-offline-models.sh dist/models

      - name: Prepare combined release bundle
        run: |
          mkdir -p dist
          cp aerial-voice/app/build/outputs/apk/full/debug/app-full-debug.apk dist/aerial-voice-full-debug.apk
          cp aerial-voice/app/build/outputs/apk/micTest/debug/app-micTest-debug.apk dist/aerial-voice-mictest06-debug.apk
          cp korobovo-upstream/app/build/outputs/apk/guard/release/*.apk dist/aerial-korobovo-voice-bridge.apk
          cp tools/install-full-assistant.ps1 tools/install-offline-models.ps1 tools/install-and-check.bat tools/diagnose-full-assistant.ps1 dist/
          cp README.md HANDOFF_NEXT_CHAT.md CHANGELOG.md dist/
          cd dist
          zip -r aerial-voice-0.7.0-offline-gigaam-vosk.zip aerial-voice-full-debug.apk aerial-voice-mictest06-debug.apk aerial-korobovo-voice-bridge.apk install-full-assistant.ps1 install-offline-models.ps1 install-and-check.bat diagnose-full-assistant.ps1 models README.md HANDOFF_NEXT_CHAT.md CHANGELOG.md

      - name: Upload combined APKs and installer
        uses: actions/upload-artifact@v4
        with:
          name: aerial-voice-0.7.0-offline-gigaam-vosk
          path: |
            dist/aerial-voice-full-debug.apk
            dist/aerial-voice-mictest06-debug.apk
            dist/aerial-korobovo-voice-bridge.apk
            dist/aerial-voice-0.7.0-offline-gigaam-vosk.zip
            dist/install-full-assistant.ps1
            dist/install-offline-models.ps1
            dist/install-and-check.bat
            dist/diagnose-full-assistant.ps1
            dist/README.md
            dist/HANDOFF_NEXT_CHAT.md
            dist/CHANGELOG.md
          if-no-files-found: error
