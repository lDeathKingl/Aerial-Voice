name: Build Aerial Voice Offline Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - feature/offline-asr-0.6.2
      - feature/stability-0.6.3
      - feature/pre-tv-0.6.4
      - feature/gigaam-dialogue-zona-0.8.1
      - feature/unified-search-voice-0.9.0

permissions:
  contents: read

jobs:
  offline-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Validate Windows PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($scriptName in @('tools/offline-install.ps1','tools/prepare-offline-models.ps1','tools/diagnose-offline.ps1','tools/configure-global-voice.ps1')) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $scriptName),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
            }
            Write-Host "$scriptName syntax OK"
          }
          $installerBytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'tools/offline-install.ps1'))
          if ($installerBytes.Where({ $_ -gt 127 }).Count -gt 0) {
            throw 'offline-install.ps1 must be ASCII-only for Windows PowerShell 5.1 compatibility.'
          }
          $cmdBytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'tools/INSTALL_OFFLINE.cmd'))
          if ($cmdBytes.Where({ $_ -gt 127 }).Count -gt 0) {
            throw 'INSTALL_OFFLINE.cmd must be ASCII-only for Windows cmd.exe compatibility.'
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'offline-install.ps1 syntax OK'
      - name: Download GigaChat CA
        run: |
          mkdir -p aerial-voice/app/src/main/res/raw
          curl --fail --location --retry 3 --retry-delay 2 "https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt" -o aerial-voice/app/src/main/res/raw/russian_trusted_root_ca_pem.crt
          test -s aerial-voice/app/src/main/res/raw/russian_trusted_root_ca_pem.crt
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key for update-compatible APK
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aerial-voice-debug-keystore-v2
      - name: Ensure signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Download sherpa-onnx Android runtime, verify hash
        run: |
          mkdir -p aerial-voice/app/libs
          curl --fail --location --retry 3 --retry-delay 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" -o aerial-voice/app/libs/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  aerial-voice/app/libs/sherpa-onnx-2.0.1.aar" | sha256sum -c -
      - name: Build Aerial Voice variants and tests
        working-directory: aerial-voice
        run: gradle --no-daemon clean :app:testMicTestDebugUnitTest :app:assembleFullDebug :app:assembleMicTestDebug
      - name: Download and verify offline GigaAM v3
        run: |
          set -euo pipefail
          mkdir -p dist/offline-models/gigaam-v3
          curl --fail --location --retry 4 --retry-delay 4 "https://huggingface.co/nocmt/GigaAM-v3-E2E-CTC-int8-ONNX/resolve/main/model.int8.onnx" -o dist/offline-models/gigaam-v3/model.int8.onnx
          curl --fail --location --retry 4 --retry-delay 4 "https://huggingface.co/nocmt/GigaAM-v3-E2E-CTC-int8-ONNX/resolve/main/tokens.txt" -o dist/offline-models/gigaam-v3/tokens.txt
          echo "784d77aaa7a0899a247e72c71d667792087ee4dec985db1f57961767a5f6014f  dist/offline-models/gigaam-v3/model.int8.onnx" | sha256sum -c -
          echo "142de7570b3de5b3035ce111a89c228e80e6085273731d944093ddf24fa539cd  dist/offline-models/gigaam-v3/tokens.txt" | sha256sum -c -
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('dist/offline-models')
          manifest={'format':'AerialVoice-offline-model-cache-v1','files':[]}
          for f in sorted(root.rglob('*')):
              if f.is_file() and f.name!='manifest.json':
                  manifest['files'].append({'path':f.relative_to(root).as_posix(),'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
          assert len(manifest['files'])==2
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Create finished offline package
        run: |
          set -euo pipefail
          cp aerial-voice/app/build/outputs/apk/full/debug/app-full-debug.apk dist/aerial-voice-full-debug.apk
          cp aerial-voice/app/build/outputs/apk/micTest/debug/app-micTest-debug.apk dist/aerial-voice-mictest06-debug.apk
          cp tools/offline-install.ps1 tools/prepare-offline-models.ps1 tools/diagnose-offline.ps1 tools/INSTALL_OFFLINE.cmd dist/
          cp tools/configure-global-voice.ps1 tools/CONFIGURE_GLOBAL_VOICE.cmd tools/RESTORE_GLOBAL_VOICE.cmd tools/CHECK_GLOBAL_VOICE.cmd dist/
          cp tools/README_OFFLINE_RU.md dist/README_OFFLINE_RU.md
          cd dist
          zip -q -r -9 aerial-voice-0.9.0-unified-search-offline.zip offline-models aerial-voice-full-debug.apk aerial-voice-mictest06-debug.apk offline-install.ps1 prepare-offline-models.ps1 diagnose-offline.ps1 configure-global-voice.ps1 CONFIGURE_GLOBAL_VOICE.cmd RESTORE_GLOBAL_VOICE.cmd CHECK_GLOBAL_VOICE.cmd INSTALL_OFFLINE.cmd README_OFFLINE_RU.md
          unzip -tq aerial-voice-0.9.0-unified-search-offline.zip
          rm aerial-voice-0.9.0-unified-search-offline.zip # Keep the artifact single-layer
      - name: Upload complete offline ZIP
        uses: actions/upload-artifact@v4
        with:
          name: aerial-voice-0.9.0-unified-search-offline
          path: dist/
          if-no-files-found: error
          retention-days: 30
